(function(){var h=document.documentElement;
 try{if(window.parent!==window)h.classList.add("embedded")}catch(e){h.classList.add("embedded")}
 function eff(){try{var t=localStorage.getItem("ems.theme");if(t==="dark"||t==="light")return t}catch(e){}
  try{if(window.parent!==window){var p=window.parent.document.documentElement.getAttribute("data-theme");if(p)return p}}catch(e){}
  return "dark"}
 h.setAttribute("data-theme",eff());
 addEventListener("storage",function(e){if(e.key==="ems.theme")h.setAttribute("data-theme",eff())});
 addEventListener("message",function(e){if(e.data&&e.data.emsTheme)h.setAttribute("data-theme",e.data.emsTheme)});
 try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){h.setAttribute("data-theme",eff())})}catch(e){}
})();

<style>
:root{--red:#c8102e;--red2:#e4283f;--r:8px;--font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
[data-theme=dark]{--bg:#121214;--panel:#1a1a1d;--panel2:#222226;--line:#2e2e33;--tx:#ececf0;--mut:#9a9aa5;--hov:#26262b;--sel:#2b1a1e;--ok:#4cc38a;--warn:#e6a23c}

*{box-sizing:border-box}html,body{height:100%;margin:0}

button,input,select,textarea{font:inherit;color:inherit}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:14px 20px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}

.sp{flex:1}

.search input:focus,.f input:focus,.f select:focus,.f textarea:focus,select.fl:focus{border-color:var(--red)}

.stats{display:flex;gap:10px;padding:0 20px 10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line)}

.st:hover{border-color:var(--red)}.st b{font-size:17px;display:block}.st span{color:var(--mut);font-size:11.5px}
.st.on{border-color:var(--red);background:var(--sel)}
.tw{flex:1;min-height:0;display:flex;flex-direction:column;margin:12px 20px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.thead,.row{display:grid;grid-template-columns:104px 84px minmax(220px,1.5fr) minmax(200px,1.3fr) 92px 74px 72px 72px 84px 28px;gap:0}
.thead{background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding-right:12px}
.thead div{padding:9px 8px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
.thead div.num,.cell.num{text-align:right}
.thead div:hover{color:var(--tx)}
.body{flex:1;overflow:auto;position:relative}
.spacer{position:relative}
.row{position:absolute;left:0;right:0;height:38px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--hov)}.row.sel{background:var(--sel)}
.cell{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.mut{color:var(--mut)}.warn{color:var(--warn)}.bad{color:var(--red2)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);margin-right:5px;vertical-align:1px}
.tag.g{border-color:var(--warn);color:var(--warn)}.tag.m{border-color:var(--ok);color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.foot{padding:8px 22px;color:var(--mut);font-size:12px;display:flex;gap:16px}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:30}
.ov.on{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:31;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh h2{margin:0;font-size:16px}.dh .mono{color:var(--mut)}
.db{flex:1;overflow:auto;padding:14px 18px}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.f{margin-bottom:12px}.f label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;outline:none}
.f textarea{resize:vertical;min-height:54px}
.f .orig{font-size:11.5px;color:var(--warn);margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.note{font-size:12px;color:var(--mut)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:88vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:41;display:none;flex-direction:column}
.modal.on{display:flex}.modal .db{padding:16px 20px}.modal .dh h2{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--mut);font-weight:500;font-size:11.5px;text-transform:uppercase}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;display:none;max-width:80vw}
.menu{position:relative;display:inline-block}
.menu .mc{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:230px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu.on .mc{display:block}.mc button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 14px;cursor:pointer}.mc button:hover{background:var(--hov)}
.load{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mut)}
@media(max-width:900px){aside{display:none}.thead,.row{grid-template-columns:100px minmax(200px,1fr) minmax(180px,1fr) 80px}.thead>*:nth-child(2),.thead>*:nth-child(5),.thead>*:nth-child(6),.thead>*:nth-child(7),.thead>*:nth-child(8),.thead>*:nth-child(9),.thead>*:nth-child(10),.row>*:nth-child(2),.row>*:nth-child(5),.row>*:nth-child(6),.row>*:nth-child(7),.row>*:nth-child(8),.row>*:nth-child(9),.row>*:nth-child(10){display:none}}
/* ---- visual Sumig EMS (cinza/preto/branco + vermelho) ---- */
:root{--red:#c1121f;--red2:#d4202e;--r:10px;--font:'Manrope','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
[data-theme=dark]{--bg:#0d0d0f;--panel:#161619;--panel2:#1f1f23;--line:#2a2a30;--tx:#ededf0;--mut:#9a9aa3;--hov:#202025;--sel:#2a1519;--ok:#5cd194;--warn:#f2c34f}

/* ==========================================================================
   MATERIAIS · refinamento visual (a lista virtualizada, as colunas e as
   alturas de linha permanecem exatamente como estavam)
   ========================================================================== */
[data-theme=dark]{
  --bg:#0a0a0c;--panel:#131316;--panel2:#1a1a1e;--line:#25252b;--line2:#33333b;--tx:#f4f4f6;--mut:#9a9aa5;--faint:#6d6d78;
  --hov:#1c1c21;--sel:#241216;--ok:#4fd49a;--warn:#f0bf4a;--input-bg:#0e0e11;--accent-fg:#ff6b76;
  --sheen:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 140px);
  --glow:radial-gradient(900px 380px at 10% -10%,rgba(217,34,47,.10),transparent 62%),radial-gradient(760px 340px at 100% -6%,rgba(130,140,170,.07),transparent 60%);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 1px 2px rgba(0,0,0,.45);
  --shadow-lg:0 28px 70px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04) inset;
  --scrim:rgba(4,4,6,.72);--ring:0 0 0 3px rgba(238,51,66,.28);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f3f3f5;--panel:#ffffff;--panel2:#f6f6f8;--line:#e3e3e9;--line2:#cfcfd8;--tx:#15151a;--mut:#62626d;--faint:#8d8d98;
  --hov:#efeff3;--sel:#fdecee;--ok:#117a4b;--warn:#8a5a00;--input-bg:#ffffff;--accent-fg:#c8101f;
  --sheen:none;
  --glow:radial-gradient(900px 360px at 8% -12%,rgba(217,34,47,.07),transparent 62%);
  --shadow:0 1px 2px rgba(20,20,28,.06),0 1px 3px rgba(20,20,28,.06);
  --shadow-lg:0 24px 60px -12px rgba(20,20,28,.28),0 0 0 1px rgba(20,20,28,.05);
  --scrim:rgba(14,14,20,.55);--ring:0 0 0 3px rgba(200,16,31,.20);
  color-scheme:light;
}
:root{--red:#d9222f;--red2:#ee3342}
[data-theme=light]{--red:#c8101f;--red2:#dc1b2b}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;background-attachment:fixed;-webkit-font-smoothing:antialiased}
::selection{background:rgba(238,51,66,.38);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

aside{background:linear-gradient(180deg,#0e0e11,#08080a);border-right:1px solid #1a1a1f;color:#ececef}

/* cabeçalho, busca e filtros */
header{padding:24px 26px 16px;background:transparent}

    else if(d[t]!==undefined&&!TR.KEEP.has(t))out.push(d[t]);

  if(lang==='fr')r=r.replace(/\bDE (?=[AEIOUÀÂÉÈÊÎÔÛ])/g,"D'");
  return {t:prefix+r,unknown,conf:unknown.length===0?'alta':(unknown.length===1?'media':'baixa')};
}

const LANGS=[{c:'en',n:'Inglês'},{c:'es',n:'Espanhol'},{c:'fr',n:'Francês'}];
const GLX={es:{},fr:{}};
const genTr=(pt,c)=>{if(c==='en'){const g=EMS_TR.translate(pt);return {t:g.en,unknown:g.unknown,conf:g.conf}}return EMS_ROM.translate(pt,c)};
const getTr=(r,c)=>{if(c==='en')return {t:r.e||'',s:r.src||''};const v=r.x&&r.x[c];return v?{t:v.t||'',s:v.s||''}:{t:'',s:''}};
function setTr(r,c,t,s){if(c==='en'){r.e=t;r.src=t?s:'';return}r.x=Object.assign({},r.x||{});if(t)r.x[c]={t,s};else delete r.x[c];if(!Object.keys(r.x).length)r.x=null}
const trTag=s=>s==='gerada'?'<span class="tag g">gerada – revisar</span>':(s==='manual'?'<span class="tag m">revisada</span>':(s==='sap'?'<span class="tag">SAP</span>':''));
function copyTxt(t){
  if(!t){toast('Nada para copiar');return}
  const ok=()=>toast('Copiado');
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Não foi possível copiar')}a.remove()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}catch(e){fb()}
}


/* ---------- persistência (IndexedDB; fallback em memória) ---------- */
function idb(){return new Promise(res=>{try{const r=indexedDB.open('ems_materiais',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('materiais',{keyPath:'m'});d.createObjectStore('meta');};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);}catch(e){res(null);}})}
const tx=(st,mode='readonly')=>DB.transaction(st,mode).objectStore(st);
const idbAll=st=>new Promise((res,rej)=>{const r=tx(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=(st,k)=>new Promise(res=>{const r=tx(st).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)});
function idbPutMany(recs){if(!DB)return Promise.resolve();return new Promise(res=>{const t=DB.transaction('materiais','readwrite');const s=t.objectStore('materiais');recs.forEach(r=>s.put(clean(r)));t.oncomplete=()=>res();t.onerror=()=>res();})}
function idbMeta(k,v){if(!DB)return;try{tx('meta','readwrite').put(v,k)}catch(e){}}
const clean=r=>{const o={};F.forEach(k=>o[k]=r[k]);o.src=r.src;o.ed=r.ed;o.t=r.t;o.x=r.x||null;return o};

async function decodeBase(){
  const bin=Uint8Array.from(atob(DATA_B64),c=>c.charCodeAt(0));
  const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
function mk(arr){const r={};F.forEach((k,i)=>r[k]=arr[i]);r.src=r.e?'sap':'';r.x=null;r.ed=0;r.t=0;return r}
function hay(r){r.h=norm(r.m+' '+r.a+' '+r.p+' '+r.e+' '+r.n+' '+(r.x?Object.values(r.x).map(v=>v.t).join(' '):''))}
const isNcmBad=r=>!/^\d{8}$/.test(r.n||'')||r.u==='NCM não encontrada';
const pesoPend=r=>!(r.b>0.001)||!(r.l>0.001);
const pesoInc=r=>r.l>r.b;

async function boot(){
  const base=await decodeBase();
  base.forEach(a=>{const r=mk(a);BASE.set(r.m,Object.assign({},r))});
  DB=await idb();
  let saved=[];
  if(DB){try{saved=await idbAll('materiais');const gl=await idbGet('meta','glossary');USERGL=gl||{};GLX.es=(await idbGet('meta','glossary_es'))||{};GLX.fr=(await idbGet('meta','glossary_fr'))||{};const bv=await idbGet('meta','baseV');
      if(!saved.length||bv!==BASE_V){ // semeia/atualiza a base mantendo o que foi editado
        const keep=new Map(saved.filter(x=>x.ed).map(x=>[x.m,x]));
        const all=base.map(a=>{const r=mk(a);return keep.get(r.m)||r});
        keep.forEach((v,k)=>{if(!BASE.has(k))all.push(v)});
        $('loadmsg').textContent='Preparando base local…';await idbPutMany(all);idbMeta('baseV',BASE_V);saved=all;}
    }catch(e){DB=null;saved=[]}}
  ROWS=saved.length?saved:base.map(mk);
  if(!saved.length&&!DB)$('dbstate').textContent='sem salvamento local';
  else $('dbstate').textContent='';
  EMS_TR.setUser(USERGL);EMS_ROM.setUser('es',GLX.es);EMS_ROM.setUser('fr',GLX.fr);
  ROWS.forEach(r=>{hay(r);});
  ROWS.forEach((r,i)=>IDX.set(r.m,i));
  fillFilters();apply();$('load').style.display='none';
  window.EMSMateriais=API();
}
function API(){return{
  get:c=>{const i=IDX.get(String(c));return i==null?null:ROWS[i]},
  pesos:c=>{const r=ROWS[IDX.get(String(c))];return r?{bruto:r.b,liquido:r.l,pendente:pesoPend(r)}:null},
  buscar:(q,n=50)=>{const t=norm(q).split(/\s+/).filter(Boolean);return ROWS.filter(r=>t.every(x=>r.h.includes(x))).slice(0,n)},
  todos:()=>ROWS,
  gerarIngles:pt=>EMS_TR.translate(pt).en,
  traduzir:(pt,l)=>genTr(pt,l).t,
  desc:(c,l)=>{const r=ROWS[IDX.get(String(c))];if(!r)return null;if(l==='pt')return r.p;return getTr(r,l).t||null}
}}

/* ---------- filtros / busca ---------- */
function fillFilters(){
  const un=[...new Set(ROWS.map(r=>r.u))].sort(), dp=[...new Set(ROWS.map(r=>r.d||'(sem)'))].sort();
  $('fUn').innerHTML='<option value="">Un. tributável: todas</option>'+un.map(u=>`<option>${esc(u)}</option>`).join('');
  $('fDep').innerHTML='<option value="">Depósito: todos</option>'+dp.map(u=>`<option>${esc(u)}</option>`).join('');
}
let qt=null;
['q','fTr','fPeso','fNcm','fUn','fDep','fEd'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{clearTimeout(qt);qt=setTimeout(apply,id==='q'?120:0)}));
$('bClear').onclick=()=>{$('q').value='';['fTr','fPeso','fNcm','fUn','fDep','fEd'].forEach(i=>$(i).value='');apply()};
function apply(){
  const t=norm($('q').value).split(/\s+/).filter(Boolean),tr=$('fTr').value,pe=$('fPeso').value,nc=$('fNcm').value,un=$('fUn').value,dp=$('fDep').value,ed=$('fEd').value;
  VIEW=[];
  for(let i=0;i<ROWS.length;i++){const r=ROWS[i];
    if(tr==='gerada'){if(!LANGS.some(l=>getTr(r,l.c).s==='gerada'))continue}else if(tr&&getTr(r,tr.slice(4)).t)continue;
    if(pe==='pend'&&!pesoPend(r))continue; if(pe==='inc'&&!pesoInc(r))continue; if(pe==='ok'&&pesoPend(r))continue;
    if(nc&&!isNcmBad(r))continue; if(un&&r.u!==un)continue; if(dp&&(r.d||'(sem)')!==dp)continue; if(ed&&!r.ed)continue;
    let ok=true;for(let k=0;k<t.length;k++){if(!r.h.includes(t[k])){ok=false;break}} if(!ok)continue;
    VIEW.push(i);}
  doSort();render(true);stats();
}
function doSort(){const k=SORT.k,d=SORT.dir;VIEW.sort((x,y)=>{const a=ROWS[x][k],b=ROWS[y][k];return (typeof a==='number'?a-b:String(a).localeCompare(String(b),'pt-BR',{numeric:true}))*d})}
function stats(){
  const n=ROWS.length;
  $('count').textContent=`${VIEW.length.toLocaleString('pt-BR')} de ${n.toLocaleString('pt-BR')} materiais`;
}

/* ---------- tabela virtual ---------- */
const COLS=[['m','Material',''],['a','Antigo',''],['p','Descrição PT',''],['n','NCM',''],['u','UN trib.',''],['b','Bruto','num'],['l','Líquido','num'],['s','Preço std','num'],['',' ','']];
$('thead').innerHTML=COLS.map(c=>`<div class="${c[2]}" data-k="${c[0]}">${c[1]}${c[0]===SORT.k?(SORT.dir>0?' ▲':' ▼'):''}</div>`).join('');
$('thead').onclick=e=>{const k=e.target.dataset.k;if(!k)return;SORT=SORT.k===k?{k,dir:-SORT.dir}:{k,dir:1};$('thead').querySelectorAll('div').forEach(d=>{const kk=d.dataset.k;const c=COLS.find(c=>c[0]===kk);d.textContent=c[1]+(kk===SORT.k?(SORT.dir>0?' ▲':' ▼'):'')});doSort();render(true)};
function render(reset){
  const b=$('body'),sp=$('spacer');sp.style.height=VIEW.length*RH+'px';
  if(reset)b.scrollTop=0;
  if(!VIEW.length){sp.innerHTML='<div class="empty">Nenhum material encontrado com esses filtros.</div>';return}
  const st=Math.max(0,Math.floor(b.scrollTop/RH)-8),en=Math.min(VIEW.length,Math.ceil((b.scrollTop+b.clientHeight)/RH)+8);
  let h='';
  for(let i=st;i<en;i++){const r=ROWS[VIEW[i]];
    const tag=r.src==='gerada'?'<span class="tag g">gerada</span>':(r.src==='manual'?'<span class="tag m">revisada</span>':'');
    const wb=pesoPend(r)?'warn':'';
    h+=`<div class="row ${VIEW[i]===SEL?'sel':''}" style="top:${i*RH}px" data-i="${VIEW[i]}">
      <div class="cell mono">${esc(r.m)}</div><div class="cell mono mut">${esc(r.a)}</div>
      <div class="cell" title="${esc(r.p)}">${esc(r.p)}</div>
      <div class="cell mono ${isNcmBad(r)?'bad':''}">${esc(r.n)||'—'}</div><div class="cell mut">${esc(r.u)}</div>
      <div class="cell num mono ${wb}">${fmt(r.b)}</div><div class="cell num mono ${pesoInc(r)?'bad':wb}">${fmt(r.l)}</div>
      <div class="cell num mono mut">${fmt(r.s,2)}</div><div class="cell">${r.ed?'<span class="dot" title="editado"></span>':''}</div></div>`;}
  sp.innerHTML=h;
}
let raf=0;$('body').addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>render(false))});
window.addEventListener('resize',()=>render(false));
$('spacer').addEventListener('click',e=>{const row=e.target.closest('.row');if(row)openItem(+row.dataset.i)});

/* ---------- edição por item ---------- */
let CUR=-1;
function openItem(i){
  CUR=i;SEL=i;const r=ROWS[i],b=BASE.get(r.m);
  $('dTitle').textContent=r.p.length>46?r.p.slice(0,46)+'…':r.p;$('dCode').textContent=r.m+(r.a?'  ·  antigo '+r.a:'');
  const fld=(k,type='text',extra='')=>{const o=b&&String(b[k])!==String(r[k])?`<div class="orig">Original: ${esc(b[k]===''?'(vazio)':b[k])}</div>`:'';return `<div class="f"><label>${LBL[k]}</label><input id="f_${k}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(r[k])}" ${extra}>${o}</div>`};
  const unOpts=[...new Set(ROWS.map(x=>x.u))].sort();
  $('dBody').innerHTML=`
   <div class="f"><label>${LBL.p}</label><textarea id="f_p">${esc(r.p)}</textarea>${b&&b.p!==r.p?`<div class="orig">Original: ${esc(b.p)}</div>`:''}</div>
   <div class="box"><div class="trh"><label class="trl">Traduções da descrição</label><button class="btn sm" id="genAll" type="button">Gerar todos</button></div>
   <div class="note" style="margin-bottom:8px">Gera a partir do português. Revise antes de salvar: o selo “gerada – revisar” fica até você abrir e salvar o item.</div>
   ${LANGS.map(l=>{const t=getTr(r,l.c),bt=b?getTr(b,l.c):{t:''};return `<div class="f trrow"><label>${l.n} ${trTag(t.s)}</label><textarea id="f_tr_${l.c}" data-c="${l.c}" rows="2">${esc(t.t)}</textarea>${b&&bt.t!==t.t?`<div class="orig">Original: ${esc(bt.t||'(vazio)')}</div>`:''}<div class="trbar"><button class="btn sm" type="button" data-gen="${l.c}">Gerar ${l.n.toLowerCase()}</button><button class="btn sm" type="button" data-copy="${l.c}">Copiar</button><span class="note" id="tri_${l.c}"></span></div></div>`}).join('')}</div>
   <div class="g2">${fld('a')}${fld('n')}</div>
   <div class="g3"><div class="f"><label>${LBL.u}</label><select id="f_u">${unOpts.map(u=>`<option ${u===r.u?'selected':''}>${esc(u)}</option>`).join('')}</select>${b&&b.u!==r.u?`<div class="orig">Original: ${esc(b.u)}</div>`:''}</div>${fld('d')}${fld('g')}</div>
   <div class="g2">${fld('b','number')}${fld('l','number')}</div><div id="wWarn" class="note bad" style="margin:-6px 0 10px"></div>
   <div class="g2">${fld('s','number')}${fld('mm','number')}</div>
   <p class="note">Alterações ficam salvas neste navegador e saem na exportação Excel (aba “Alterações” mostra antes/depois).</p>`;
  const chk=()=>{const bb=parseFloat($('f_b').value),ll=parseFloat($('f_l').value);$('wWarn').textContent=ll>bb?'⚠ Peso líquido maior que o bruto.':(bb<=0.001||ll<=0.001?'⚠ Peso ainda é o valor padrão (0,001) ou zero.':'')};
  ['f_b','f_l'].forEach(id=>$(id).oninput=chk);chk();
  const doGen=c=>{const g=genTr($('f_p').value,c),ta=$('f_tr_'+c);ta.value=g.t;ta.dataset.gen='1';$('tri_'+c).innerHTML=`confiança <b>${g.conf}</b>`+(g.unknown.length?` · sem tradução: <b>${esc(g.unknown.join(', '))}</b> (adicione no Glossário)`:'')};
  $('dBody').querySelectorAll('[data-gen]').forEach(bt=>bt.onclick=()=>doGen(bt.dataset.gen));
  $('dBody').querySelectorAll('[data-copy]').forEach(bt=>bt.onclick=()=>copyTxt($('f_tr_'+bt.dataset.copy).value));
  $('dBody').querySelectorAll('textarea[data-c]').forEach(ta=>ta.addEventListener('input',()=>{delete ta.dataset.gen}));
  $('genAll').onclick=()=>LANGS.forEach(l=>doGen(l.c));
  $('dReset').style.display=r.ed?'':'none';
  $('drawer').classList.add('on');$('ov').classList.add('on');render(false);
}
function closeDrawer(){$('drawer').classList.remove('on');$('ov').classList.remove('on');CUR=-1}
$('dClose').onclick=$('dCancel').onclick=closeDrawer;$('ov').onclick=()=>{closeDrawer();closeModal()};
$('dPrev').onclick=()=>nav(-1);$('dNext').onclick=()=>nav(1);
function nav(d){const p=VIEW.indexOf(CUR);const n=VIEW[p+d];if(n!=null)openItem(n)}
$('dSave').onclick=async()=>{
  const r=ROWS[CUR];const old=Object.assign({},r);const oldTr={};LANGS.forEach(l=>oldTr[l.c]=Object.assign({},getTr(r,l.c)));
  const num=k=>{const v=parseFloat(String($('f_'+k).value).replace(',','.'));return isNaN(v)?0:v};
  r.p=$('f_p').value.trim();r.a=$('f_a').value.trim();r.n=$('f_n').value.trim();r.u=$('f_u').value;r.d=$('f_d').value.trim();r.g=$('f_g').value.trim();
  r.b=num('b');r.l=num('l');r.s=num('s');r.mm=num('mm');
  LANGS.forEach(l=>{const ta=$('f_tr_'+l.c);if(!ta)return;const nt=ta.value.trim(),ot=oldTr[l.c];
    if(nt!==ot.t)setTr(r,l.c,nt,ta.dataset.gen?'gerada':'manual');
    else if(ot.s==='gerada'&&nt)setTr(r,l.c,nt,'manual')});
  finalize(r);await idbPutMany([r]);apply();toast('Material salvo');closeDrawer();
};
function finalize(r){const b=BASE.get(r.m);r.ed=(!b||F.some(k=>String(b[k])!==String(r[k]))||(r.src!==b.src)||(r.x&&Object.keys(r.x).length>0))?1:0;r.t=Date.now();hay(r)}
$('dReset').onclick=async()=>{const b=BASE.get(ROWS[CUR].m);if(!b)return;const r=ROWS[CUR];Object.assign(r,b,{ed:0,t:0});hay(r);await idbPutMany([r]);apply();toast('Restaurado ao original');closeDrawer()};

/* ---------- gerar traduções em lote ---------- */
$('bGen').onclick=()=>openBatch('en');
function openBatch(c){
  const L=LANGS.find(l=>l.c===c);
  const sel=`<p>Idioma: <select id="bLang" class="fl" style="margin-left:6px">${LANGS.map(l=>`<option value="${l.c}" ${l.c===c?'selected':''}>${l.n}</option>`).join('')}</select></p>`;
  const todo=VIEW.filter(i=>!getTr(ROWS[i],c).t);
  const bind=()=>{$('bLang').onchange=()=>openBatch($('bLang').value)};
  if(!todo.length){openModal('Gerar traduções',sel+`<p class="note">Nenhum item sem ${L.n.toLowerCase()} no filtro atual.</p>`,'<span class="sp"></span><button class="btn" onclick="closeModal()">Fechar</button>');bind();return}
  const res=todo.map(i=>({i,g:genTr(ROWS[i].p,c)}));const k={alta:0,media:0,baixa:0};res.forEach(x=>k[x.g.conf]++);
  openModal('Gerar traduções',sel+`<p>${todo.length.toLocaleString('pt-BR')} itens sem ${L.n.toLowerCase()} no filtro atual. As descrições geradas ficam marcadas como <span class="tag g">gerada</span> até você revisar.</p>
   <table class="t"><tr><th>Confiança</th><th>Itens</th><th>Significado</th></tr><tr><td>alta</td><td>${k.alta}</td><td class="mut">todas as palavras estavam no glossário</td></tr><tr><td>média</td><td>${k.media}</td><td class="mut">1 palavra sem tradução</td></tr><tr><td>baixa</td><td>${k.baixa}</td><td class="mut">2+ palavras sem tradução</td></tr></table>
   <p style="margin-top:14px"><b>Amostra</b></p><table class="t">${res.slice(0,6).map(x=>`<tr><td class="mut">${esc(ROWS[x.i].p)}</td><td>${esc(x.g.t)}</td></tr>`).join('')}</table>`,
   `<label class="note"><input type="checkbox" id="onlyHigh" checked> aplicar só nos de confiança alta (${k.alta})</label><span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="doGen">Gerar</button>`);
  bind();
  $('doGen').onclick=async()=>{const oh=$('onlyHigh').checked;const ch=[];res.forEach(x=>{if(oh&&x.g.conf!=='alta')return;const r=ROWS[x.i];setTr(r,c,x.g.t,'gerada');finalize(r);ch.push(r)});await idbPutMany(ch);closeModal();apply();toast(`${ch.length} descrições geradas — revise com o filtro “Geradas a revisar”`)};
}

/* ---------- glossário (por idioma) ---------- */
let GLL='en';
$('bGloss').onclick=()=>{
  const L=LANGS.find(l=>l.c===GLL),cur=GLL==='en'?USERGL:GLX[GLL],rows=Object.entries(cur);
  openModal('Glossário PT → '+L.n,`<p class="note">O gerador já traz um glossário de termos de soldagem. Aqui você ensina palavras que ele não conhece; elas valem para as próximas gerações naquele idioma.</p>
   <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center"><select id="gLang" class="fl">${LANGS.map(l=>`<option value="${l.c}" ${l.c===GLL?'selected':''}>${l.n}</option>`).join('')}</select><input id="gPT" placeholder="Palavra em PT (ex.: PRESSIONADOR)" style="flex:1" class="fl"><input id="gEN" placeholder="${L.n} (ex.: PRESSER)" style="flex:1" class="fl"><button class="btn" id="gAdd">Adicionar</button></div>
   <table class="t" id="gT"><tr><th>PT</th><th>${L.n}</th><th></th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td><td><button class="btn sm" data-del="${esc(k)}">✕</button></td></tr>`).join('')||'<tr><td colspan=3 class="mut">Nenhum termo seu ainda.</td></tr>'}</table>
   <p style="margin-top:16px"><button class="btn" id="gGap">Analisar palavras sem tradução (itens sem ${L.n.toLowerCase()})</button></p><div id="gGapOut"></div>`,'');
  const css='background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px';$('gPT').style.cssText=$('gEN').style.cssText=css;
  const saveG=()=>{if(GLL==='en'){EMS_TR.setUser(USERGL);idbMeta('glossary',USERGL)}else{EMS_ROM.setUser(GLL,GLX[GLL]);idbMeta('glossary_'+GLL,GLX[GLL])}};
  $('gLang').onchange=()=>{GLL=$('gLang').value;$('bGloss').click()};
  $('gAdd').onclick=()=>{const a=EMS_TR.norm($('gPT').value).trim(),b=$('gEN').value.trim();if(!a||!b)return;cur[a]=b.toUpperCase();saveG();$('bGloss').click()};
  $('gT').onclick=e=>{const k=e.target.dataset.del;if(k){delete cur[k];saveG();$('bGloss').click()}};
  $('gGap').onclick=()=>{const c={};ROWS.forEach(r=>{if(getTr(r,GLL).t)return;genTr(r.p,GLL).unknown.forEach(u=>c[u]=(c[u]||0)+1)});
    const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,40);
    $('gGapOut').innerHTML=`<table class="t"><tr><th>Palavra</th><th>Itens</th><th>${L.n}</th></tr>${top.map(([w,n])=>`<tr><td>${esc(w)}</td><td>${n}</td><td><input data-w="${esc(w)}" style="${css};width:100%;color:inherit" placeholder="…"></td></tr>`).join('')}</table><p><button class="btn pri" id="gSaveGap">Salvar termos preenchidos</button></p>`;
    $('gSaveGap').onclick=()=>{$('gGapOut').querySelectorAll('input').forEach(i=>{if(i.value.trim())cur[EMS_TR.norm(i.dataset.w).trim()]=i.value.trim().toUpperCase()});saveG();$('bGloss').click();toast('Glossário atualizado')}};
};

/* ---------- importar / exportar Excel ---------- */
$('bImport').onclick=()=>$('fileIn').click();
$('fileIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const js=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
    const inv={};F.forEach(k=>inv[LBL[k]]=k);inv[LBL.xes]='xes';inv[LBL.xfr]='xfr';const upd=[],nw=[];
    js.forEach(o=>{const rec={};for(const h in o){const k=inv[h.trim()];if(k)rec[k]=o[h]}
      if(rec.m==null||rec.m==='')return;rec.m=String(rec.m).trim().padStart(10,'0');
      ['b','l','s','mm'].forEach(k=>{if(k in rec)rec[k]=parseFloat(String(rec[k]).replace(',','.'))||0});
      ['a','p','e','n','u','d','g','xes','xfr'].forEach(k=>{if(k in rec)rec[k]=String(rec[k]).trim()});
      const i=IDX.get(rec.m);
      if(i==null){nw.push(rec);return}
      const r=ROWS[i];const cur=k=>k==='xes'?getTr(r,'es').t:(k==='xfr'?getTr(r,'fr').t:r[k]);const diff=Object.keys(rec).filter(k=>k!=='m'&&!(rec[k]===''&&(k==='xes'||k==='xfr'))&&String(rec[k])!==String(cur(k)));if(diff.length)upd.push({r,rec,diff});});
    const cnt={};upd.forEach(x=>x.diff.forEach(k=>cnt[k]=(cnt[k]||0)+1));
    if(!upd.length&&!nw.length){toast('Nenhuma diferença em relação à base atual');return}
    openModal('Importar planilha',`<p><b>${upd.length}</b> materiais com alterações e <b>${nw.length}</b> códigos novos.</p><table class="t"><tr><th>Campo</th><th>Alterações</th></tr>${Object.entries(cnt).map(([k,n])=>`<tr><td>${LBL[k]}</td><td>${n}</td></tr>`).join('')}</table><p class="note">Colunas reconhecidas pelo cabeçalho (mesmo formato da exportação). Campos vazios no Excel não apagam dados.</p>`,
     `<span class="sp"></span><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="doImp">Aplicar</button>`);
    $('doImp').onclick=async()=>{const ch=[];
      upd.forEach(({r,rec,diff})=>{diff.forEach(k=>{if(rec[k]===''&&['p','e','a','n','d','g'].includes(k))return;if(k==='xes'||k==='xfr'){setTr(r,k.slice(1),String(rec[k]),'manual');return}r[k]=rec[k]; if(k==='e')r.src='manual'});finalize(r);ch.push(r)});
      nw.forEach(rec=>{const r={m:'',a:'',p:'',e:'',n:'',u:'UN',s:0,mm:0,d:'',b:0.001,l:0.001,g:'',src:'',x:null,ed:1,t:Date.now()};Object.assign(r,rec);if(r.e)r.src='manual';['es','fr'].forEach(c=>{const v=r['x'+c];if(v)setTr(r,c,String(v),'manual');delete r['x'+c]});hay(r);IDX.set(r.m,ROWS.length);ROWS.push(r);ch.push(r)});
      await idbPutMany(ch);closeModal();fillFilters();apply();toast(`${upd.length} atualizados · ${nw.length} novos`)};
  }catch(err){console.error(err);toast('Não consegui ler o arquivo Excel')}
};
$('bExp').onclick=e=>{e.stopPropagation();$('mExp').classList.toggle('on')};
document.addEventListener('click',()=>$('mExp').classList.remove('on'));
$('mExp').querySelector('.mc').onclick=e=>{const x=e.target.dataset.x;if(x)doExport(x)};
function doExport(mode){
  const list=mode==='view'?VIEW.map(i=>ROWS[i]):(mode==='edited'?ROWS.filter(r=>r.ed):ROWS);
  if(!list.length){toast('Nada para exportar');return}
  const head=[...F.map(k=>LBL[k]),'Origem do inglês',LBL.xes,LBL.xfr,'Editado'];
  const aoa=[head,...list.map(r=>[...F.map(k=>r[k]),r.src==='sap'?'SAP':(r.src==='gerada'?'Gerada (revisar)':(r.src==='manual'?'Revisada':'')),getTr(r,'es').t,getTr(r,'fr').t,r.ed?'Sim':''])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[12,12,50,44,11,14,12,14,9,11,11,7,16,44,44,9].map(w=>({wch:w}));ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:head.length-1}})};ws['!freeze']={xSplit:0,ySplit:1};
  // código como texto; NCM como texto
  for(let R=1;R<aoa.length;R++){[0,1,4].forEach(C=>{const c=ws[XLSX.utils.encode_cell({r:R,c:C})];if(c){c.t='s';c.z='@'}})}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Materiais');
  const chg=[['Material','Campo','Antes','Depois']];ROWS.forEach(r=>{if(!r.ed)return;const b=BASE.get(r.m);if(!b){chg.push([r.m,'(novo material)','',r.p]);return}F.forEach(k=>{if(k!=='m'&&String(b[k])!==String(r[k]))chg.push([r.m,LBL[k],b[k],r[k]])});['es','fr'].forEach(c=>{const bt=getTr(b,c).t,nt=getTr(r,c).t;if(bt!==nt)chg.push([r.m,LBL['x'+c],bt,nt])})});
  if(chg.length>1){const w2=XLSX.utils.aoa_to_sheet(chg);w2['!cols']=[{wch:12},{wch:24},{wch:44},{wch:44}];XLSX.utils.book_append_sheet(wb,w2,'Alterações')}
  const d=new Date().toISOString().slice(0,10);
  saveFile(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`EMS_Materiais_${mode}_${d}.xlsx`);
  toast(`${list.length.toLocaleString('pt-BR')} materiais exportados`);
}
async function saveFile(blob,name){
  try{if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});return}}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

/* ---------- utilidades de UI ---------- */
function openModal(t,b,f){$('mTitle').textContent=t;$('mBody').innerHTML=b;$('mFoot').innerHTML=f;$('mFoot').style.display=f?'flex':'none';$('mdl').classList.add('on');$('ov').classList.add('on')}
function closeModal(){$('mdl').classList.remove('on');if(!$('drawer').classList.contains('on'))$('ov').classList.remove('on')}
$('mClose').onclick=closeModal;
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
$('theme').onclick=()=>{const h=document.documentElement;const n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;try{localStorage.setItem('ems.theme',n)}catch(e){}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('q').focus()}});
boot().catch(e=>{console.error(e);$('loadmsg').textContent='Erro ao carregar: '+e.message});
</script>
